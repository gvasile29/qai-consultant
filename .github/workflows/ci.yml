name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          ANONYMIZED_TELEMETRY: "False"
          CHROMA_TELEMETRY: "False"
        run: |
          python -m pytest tests/ -v -p no:warnings
        # Live-LLM tests (test_risk_analyzer.py, test_app_v03.py::test_both_documents_...,
        # test_effort_estimator.py::test_full_estimate_bmw) SKIP themselves via the
        # `agent` fixture when no API keys are configured — no ignore/deselect needed.

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: |
          ruff check src/ tests/ \
            --ignore E501,E402,F401,W291,W293

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: |
          set -o pipefail
          echo "## mypy (src/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mypy src/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Blocking since PR #63 — the pre-existing 53-error backlog was cleared
        # in PR #61. `set -o pipefail` is required: bash's default pipe exit
        # status is the LAST command's (tee, always 0), which silently masked
        # mypy's real exit code until this was caught in PR #67 — see the
        # pipefail gotcha in CLAUDE.md's Gotchas section.

  security-bandit:
    name: Security (bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run bandit
        run: |
          set -o pipefail
          echo "## bandit (src/, medium+ severity)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bandit -r src/ -ll | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Blocking since PR #63 — the pre-existing 2-finding backlog was
        # cleared in PR #61. `set -o pipefail` is required — see the pipefail
        # gotcha in CLAUDE.md's Gotchas section.

  security-pip-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pip-audit
        continue-on-error: true
        run: |
          set -o pipefail
          echo "## pip-audit (requirements.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r requirements.txt --desc | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Non-blocking: unlike mypy/bandit, a new CVE can appear in a transitive
        # dependency with no fixed version yet available, which would block
        # unrelated PRs with no escape hatch. Promote once there's an
        # allowlist/waiver mechanism for exactly this case. See CLAUDE.md's CI section.

  evals-det:
    name: Evals (deterministic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run deterministic eval gate
        run: |
          set -o pipefail
          echo "## evals/run --det" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m evals.run --det | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage (pytest-cov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run coverage gate
        run: |
          set -o pipefail
          echo "## Coverage (src/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=60 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
