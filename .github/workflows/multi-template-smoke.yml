name: Multi-Template Generation Smoke

# One full live generation per project template, then the content gates in
# scripts/llm_e2e_smoke.py (output lint, review score, cross-document consistency).
# Weekly, not nightly: each run is ~5 LLM calls per template, and the OpenRouter
# free tier (50 requests/day) is shared with the production fallback.
# Never triggers on push/pull_request, so it cannot block a PR.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

env:
  QAI_TELEMETRY: "0"  # MCP telemetry is on by default; never report CI runs to PostHog

jobs:
  smoke:
    name: Smoke (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1  # serial, to stay under provider rate limits
      matrix:
        template: [web_app, mobile_app, microservices, automotive]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke generation
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          set -o pipefail
          echo "## Smoke: ${{ matrix.template }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/llm_e2e_smoke.py --template ${{ matrix.template }} --require-mistral | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ matrix.template }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
