[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qai-consultant-mcp"
version = "3.6.2"
description = "Local, keyless MCP server: standards-grounded QA knowledge retrieval (ISTQB, OWASP, IEEE, ISO, EU AI Act), deterministic QA effort estimation, QA document quality review, test-results health analysis, and QA process maturity assessment."
readme = "README_MCP.md"
requires-python = ">=3.10"
# Table form (not the newer SPDX string) for compatibility with setuptools < ~77,
# which raises a hard ValueError on the string form rather than just a deprecation
# warning — this needs to build cleanly on whatever setuptools version a consumer's
# environment happens to have, not just the newest one.
license = { text = "Apache-2.0" }
authors = [{ name = "QAI Consultant Contributors" }]
keywords = ["mcp", "model-context-protocol", "qa", "testing", "quality-assurance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Full transitive lock, not just the 6 direct imports: exact-pinning only the
# direct deps (v3.3.1) left every indirect one (scipy, scikit-learn, numpy,
# transformers, ...) free to pick up a new upstream release between two
# launches, forcing uv to re-resolve/reinstall on the next `uvx` start. That's
# exactly what happened 2026-08-31 -- scikit-learn pulled in a scipy release
# uv hadn't cached yet, and the 35MB download alone pushed a cold start past
# Claude Desktop's ~60s initialize timeout, with the client's cancel-on-timeout
# aborting the install mid-extraction so the wheel never even reached the
# permanent cache -- every subsequent launch repeated the same failed download.
# Generated via `uv pip compile pyproject.toml --universal --python-version
# 3.10`; regenerate the same way (against the *previous* pinned set, so drift
# is deliberate) when a direct dependency needs a version bump. Do NOT add
# a scoped `--extra-index-url` (e.g. https://download.pytorch.org/whl/cpu) to
# that command — see the v3.5.1 incident note near the (removed)
# `[tool.uv.sources]` block further down this file: a CPU-index-scoped pin
# resolves fine for this project's own tooling but breaks every real
# `uvx qai-consultant-mcp` consumer, since PyPI-consumer resolution never sees
# this file's `[tool.uv.*]` config. (The package that originally motivated
# this warning, `torch`, was removed from this dependency list entirely in
# v3.5.3 when the local index's embedding backend switched to
# fastembed/onnxruntime — see CLAUDE.md's v3.5.3 roadmap entry — but the same
# PyPI-vs-project-local-config trap applies to any future platform-specific
# wheel pin.)
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1 ; platform_python_implementation != 'PyPy'",
    "charset-normalizer==3.5.1",
    "click==8.5.0 ; sys_platform != 'emscripten'",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "coloredlogs==15.0.1 ; python_full_version < '3.11'",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "exceptiongroup==1.3.1 ; python_full_version < '3.11'",
    "fastembed==0.8.0",
    "filelock==3.32.4",
    "flatbuffers==25.12.19",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0 ; platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'arm64' or platform_machine == 'x86_64'",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "huggingface-hub==0.36.2",
    "humanfriendly==10.0 ; python_full_version < '3.11'",
    "idna==3.19",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "loguru==0.7.3",
    "mcp==1.28.1",
    "mmh3==5.3.0",
    "mpmath==1.3.0",
    "numpy==2.2.6 ; python_full_version < '3.11'",
    "numpy==2.4.6 ; python_full_version == '3.11.*'",
    "numpy==2.5.2 ; python_full_version >= '3.12'",
    "onnxruntime==1.23.2 ; python_full_version < '3.11'",
    "onnxruntime==1.30.0 ; python_full_version >= '3.11'",
    "packaging==26.3",
    "pillow==12.3.0",
    "platformdirs==4.11.0",
    "protobuf==7.36.2",
    "py-rust-stemmers==0.1.8",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "pyreadline3==3.5.6 ; python_full_version < '3.11' and sys_platform == 'win32'",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pywin32==312 ; sys_platform == 'win32'",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==0.30.0 ; python_full_version < '3.11'",
    "rpds-py==2026.6.3 ; python_full_version >= '3.11'",
    "sse-starlette==3.4.8",
    "starlette==1.6.0",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "tqdm==4.70.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.4 ; sys_platform != 'emscripten'",
    "win32-setctime==1.2.0 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/gvasile29/qai-consultant"
Repository = "https://github.com/gvasile29/qai-consultant"

[project.scripts]
qai-consultant-mcp = "mcp_server:main"

[tool.mypy]
ignore_missing_imports = true

# ── uv: NO scoped platform-specific index here — see the v3.5.1 incident note below ──
# A `[tool.uv.sources]`/`[[tool.uv.index]]` scoped-index block used to live here
# (MCP_PLAN.md section 6's "Decided 2026-07-15" note), routing `torch` to
# download.pytorch.org's CPU-only wheel index. DO NOT re-add a block like it for
# any future dependency: `[tool.uv.*]` config is a *project-local* uv setting —
# it applies when `uv` resolves this repo's own pyproject.toml directly
# (`uv sync`, `uv run`, or a manual `uv pip compile pyproject.toml ...`), but it
# is NOT distributed as part of the built wheel/sdist metadata, so a real end
# user's `uvx qai-consultant-mcp` (which only ever resolves against plain PyPI,
# having never seen this repo's pyproject.toml) cannot see it. The 2026-09
# drift-canary regeneration (`c45bf21`) correctly resolved `torch==2.13.0+cpu`
# *for this project's own compile step*, baked that version string into
# `dependencies`, and published it as `qai-consultant-mcp==3.5.1` — which then
# failed to resolve for every real `uvx`/`pip install` consumer with "no version
# of torch==2.13.0+cpu", since plain PyPI never mirrors that CPU-tagged local
# version. Caught post-publish via a real `uvx --from qai-consultant-mcp==3.5.1
# ...` smoke test from a neutral directory (not run before that release — see
# the Gotchas entry in CLAUDE.md); fixed by reverting to a plain `torch==2.13.0`
# pin, which resolved identically for both local project tooling and real
# consumers. As of v3.5.3, `torch` (and the CPU-wheel question entirely) is moot
# here — the local index's embedding backend switched to fastembed/onnxruntime
# and `torch` was dropped from `dependencies` above — but the lesson generalizes:
# if a platform-specific wheel index is ever worth pursuing again for some other
# dependency, it needs a mechanism that survives being published to PyPI (e.g. a
# documented `--extra-index-url` in the install instructions), not project-local
# `[tool.uv.sources]` scoping.

# ── setuptools: flat modules from src/, no nested package ───────────────────────
# Matches these modules' existing bare `from x import y` style (no package prefix) —
# see mcp_server.py's own note on why `from __future__ import annotations` is absent;
# this flat layout is the same "don't fight the existing import style" choice.
[tool.setuptools]
py-modules = [
    "mcp_server", "dialogue", "effort_core", "local_index",
    "telemetry", "prompts", "kb_config", "logger", "version",
    "review_core", "results_core", "maturity_core", "risk_ledger",
]

[tool.setuptools.package-dir]
"knowledge_base" = "knowledge_base"
"" = "src"

# ── knowledge_base/: self-authored .md content only (licensing gate, section 5) ──
# Whitelisted per-folder, not a blanket include of standards/ or a **/*.md glob:
# standards/istqb/ and standards/owasp/ hold third-party PDFs (and one HTML dupe)
# whose redistribution rights are unclear, and this whitelist is what keeps them
# out — an explicit list forces a deliberate decision on every future addition,
# per MCP_PLAN.md section 5 ("review every shipped .md for third-party text lifted
# verbatim" before first publish). tests/test_packaging.py asserts zero .pdf files
# make it into the built wheel regardless, as the actual enforced gate.
[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_base*"]
namespaces = true

[tool.setuptools.exclude-package-data]
"*" = ["*.pdf", "*.html", "generated_strategies/*"]

[tool.setuptools.package-data]
"knowledge_base" = ["*.md"]
"knowledge_base.methodologies" = ["*.md"]
"knowledge_base.evaluation_audit" = ["*.md"]
"knowledge_base.expert_knowledge" = ["*.md"]
"knowledge_base.articles" = ["*.md"]
"knowledge_base.articles.ai_sdlc" = ["*.md"]
"knowledge_base.standards" = ["*.md"]
"knowledge_base.standards.eu_ai_act" = ["*.md"]
"knowledge_base.standards.owasp" = ["*.md"]
