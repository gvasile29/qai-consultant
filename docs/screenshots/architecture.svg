<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#0e7490; stroke-width:2; rx:10; }
    .box-alt { fill:#f0f9ff; stroke:#0e7490; stroke-width:2; rx:10; }
    .box-doc { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:10; }
    .title { font-size:20px; font-weight:700; fill:#0e7490; }
    .label { font-size:15px; font-weight:600; fill:#0f172a; }
    .sub { font-size:12.5px; fill:#475569; }
    .doclabel { font-size:14px; font-weight:600; fill:#065f46; }
    .arrow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .dim { font-size:12px; fill:#64748b; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="1220" fill="#ffffff"/>

  <text x="450" y="40" text-anchor="middle" class="title">QAI Consultant — Architecture</text>

  <!-- User Input -->
  <rect x="300" y="65" width="300" height="55" class="box"/>
  <text x="450" y="90" text-anchor="middle" class="label">User Input</text>
  <text x="450" y="108" text-anchor="middle" class="sub">11-question dialogue → ProjectContext</text>

  <path class="arrow" d="M450,120 L450,150"/>

  <!-- Parallel RAG prefetch -->
  <rect x="230" y="150" width="440" height="90" class="box-alt"/>
  <text x="450" y="175" text-anchor="middle" class="label">Parallel RAG Prefetch</text>
  <text x="450" y="194" text-anchor="middle" class="sub">ThreadPoolExecutor (3 workers) — Risk / Strategy / Test Plan queries</text>
  <text x="450" y="212" text-anchor="middle" class="sub">→ Pinecone vector search (each wrapped in try/except → [] on failure)</text>
  <text x="450" y="228" text-anchor="middle" class="dim">knowledge_base/*.md + *.pdf, embedded with all-MiniLM-L6-v2</text>

  <path class="arrow" d="M450,240 L450,270"/>

  <!-- Step 1: Risk Register -->
  <rect x="230" y="270" width="440" height="80" class="box"/>
  <text x="250" y="295" class="label">1. Risk Register</text>
  <text x="250" y="314" class="sub">build_risk_prompt() → agent.ask_streaming()</text>
  <text x="250" y="331" class="sub">Mistral API primary, OpenRouter fallback</text>
  <text x="620" y="314" text-anchor="end" class="dim">saved to output/</text>

  <path class="arrow" d="M450,350 L450,380"/>

  <!-- Step 2: Effort Estimation -->
  <rect x="230" y="380" width="440" height="80" class="box"/>
  <text x="250" y="405" class="label">2. Effort Estimation</text>
  <text x="250" y="424" class="sub">Deterministic PERT + multipliers (normalized to 100%)</text>
  <text x="250" y="441" class="sub">+ short LLM narrative + confidence score (0–100)</text>

  <path class="arrow" d="M450,460 L450,490"/>

  <!-- Step 3: Test Strategy -->
  <rect x="230" y="490" width="440" height="80" class="box"/>
  <text x="250" y="515" class="label">3. Test Strategy</text>
  <text x="250" y="534" class="sub">build_strategy_prompt() → agent.ask_streaming()</text>
  <text x="250" y="551" class="sub">ISTQB / OWASP / ISO-aligned, grounded in RAG chunks</text>

  <path class="arrow" d="M450,570 L450,600"/>

  <!-- Step 4: Test Plan -->
  <rect x="230" y="600" width="440" height="80" class="box"/>
  <text x="250" y="625" class="label">4. Test Plan</text>
  <text x="250" y="644" class="sub">build_test_plan_prompt() → agent.ask_streaming()</text>
  <text x="250" y="661" class="sub">IEEE 829-aligned, informed by the Risk Register</text>

  <path class="arrow" d="M450,680 L450,710"/>

  <!-- Four documents -->
  <rect x="120" y="710" width="660" height="90" class="box-doc"/>
  <text x="450" y="734" text-anchor="middle" class="label">Four Documents Ready</text>
  <text x="180" y="762" class="doclabel">⚠️ Risk Register</text>
  <text x="340" y="762" class="doclabel">📊 Effort Estimation</text>
  <text x="540" y="762" class="doclabel">📋 Test Strategy</text>
  <text x="700" y="762" class="doclabel">📝 Test Plan</text>
  <text x="450" y="786" text-anchor="middle" class="sub">Markdown files (output/) + PDF download</text>

  <path class="arrow" d="M450,800 L450,830"/>

  <!-- Feedback loop -->
  <rect x="230" y="830" width="440" height="100" class="box-alt"/>
  <text x="450" y="855" text-anchor="middle" class="label">Feedback Loop</text>
  <text x="450" y="874" text-anchor="middle" class="sub">"Was this useful?" — yes / partially → validated strategy saved to</text>
  <text x="450" y="891" text-anchor="middle" class="sub">knowledge_base/generated_strategies/</text>
  <text x="450" y="909" text-anchor="middle" class="dim">ingested on the next python src/ingest.py run</text>

  <!-- LLM Client legend box -->
  <rect x="120" y="970" width="330" height="110" class="box"/>
  <text x="140" y="995" class="label">LLMClient</text>
  <text x="140" y="1016" class="sub">Mistral API (mistral-small-latest)</text>
  <text x="140" y="1034" class="sub">↳ on any error, falls back to</text>
  <text x="140" y="1052" class="sub">OpenRouter (mistral-small-3.2-24b)</text>
  <text x="140" y="1070" class="dim">both failing → QAIConnectionError</text>

  <!-- Knowledge base legend box -->
  <rect x="470" y="970" width="330" height="110" class="box"/>
  <text x="490" y="995" class="label">Knowledge Base</text>
  <text x="490" y="1016" class="sub">Pinecone vector index (namespace:</text>
  <text x="490" y="1034" class="sub">knowledge-base), cosine similarity</text>
  <text x="490" y="1052" class="sub">Standards · Methodologies · Articles</text>
  <text x="490" y="1070" class="dim">Expert Knowledge · Generated Strategies</text>

  <text x="450" y="1130" text-anchor="middle" class="dim">Interfaces: CLI (src/cli.py, Rich) and Web UI (src/app.py, Streamlit) share the same pipeline above.</text>
  <text x="450" y="1150" text-anchor="middle" class="dim">See CLAUDE.md for the full data-flow and per-step exception-isolation details.</text>
</svg>
